[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
user=node
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
user=node
priority=20
autorestart=true
environment=DISPLAY=":99",HOME="/home/node"
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -localhost -rfbport 5900 -forever -shared -nopw -xkb -repeat
user=node
priority=30
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=node
priority=40
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:app]
command=/usr/local/bin/node /app/server/index.js
directory=/app
user=node
priority=50
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
